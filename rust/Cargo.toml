[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "ISC"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
parking_lot = "0.12"
once_cell = "1"
tracing = "0.1"
