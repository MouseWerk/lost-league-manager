<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Overlay</title>
    <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
    <!-- In-game overlay. The window takes the size of #ovRoot (overlay.js). -->
    <div class="ov-root" id="ovRoot">

        <!-- The bar: your champion and score. Dragging it (not its buttons) moves the overlay. -->
        <div class="ov-bar" id="ovBar">
            <div class="ov-champ" id="ovDrag">
                <img class="ov-champ-icon" id="ovChampIcon" src="assets/logo.png" alt="" data-fallback="logo">
                <span class="ov-level" id="ovLevel">1</span>
            </div>

            <div class="ov-score" id="ovLive">
                <div class="ov-kda" id="ovKda">0/0/0</div>
                <div class="ov-sub">
                    <span id="ovCs">0 CS</span>
                    <span class="ov-csm" id="ovCsm"></span>
                    <span class="ov-gold" id="ovGold">0</span>
                </div>
            </div>

            <div class="ov-score ov-dead" id="ovDeadBar" hidden>
                <div class="ov-respawn"><span id="ovRespawnCount">0</span><span class="ov-respawn-unit">s</span></div>
                <div class="ov-sub" id="ovDeadTip">Shop while you wait</div>
            </div>

            <div class="ov-time" id="ovTimer">00:00</div>

            <div class="ov-actions">
                <button class="ov-btn" id="ovGameToggle" aria-pressed="false" aria-label="Game" data-tip="Game">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13.5h12"/><path d="M4 11V7.5M8 11V3.5M12 11V6"/></svg>
                </button>
                <button class="ov-btn" id="ovToggle" aria-pressed="false" aria-label="Players" data-tip="Players">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.4 2.3-3.6 4.5-3.6s3.9 1.2 4.5 3.6"/><path d="M10.5 3.2a2.4 2.4 0 0 1 0 4.6M12 9.9c1.3.5 2.1 1.7 2.5 3.6"/></svg>
                </button>
                <button class="ov-btn" id="ovBuildToggle" aria-pressed="false" aria-label="Build" data-tip="Build">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
                </button>
                <button class="ov-btn" id="ovSettingsBtn" aria-pressed="false" aria-label="Settings" data-tip="Settings">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
                </button>
            </div>
            <div class="ov-respawn-bar" id="ovRespawnBar" hidden><span id="ovRespawnFill"></span></div>
        </div>

        <!-- Game: both teams' kills, item gold and objectives, and how you are doing. -->
        <section class="ov-panel" id="ovGame" hidden>
            <div id="ovGameContent"><p class="ov-msg">Waiting for the game...</p></div>
        </section>

        <!-- Players: both teams with rank, win rate and score. -->
        <section class="ov-panel" id="ovRanked" hidden>
            <div id="ovRankedContent"><p class="ov-msg">Waiting for the game...</p></div>
        </section>

        <!-- Build: OP.GG runes, items and skill order for your champion. -->
        <section class="ov-panel" id="ovBuilds" hidden>
            <div id="ovBuildsContent"><p class="ov-msg">Waiting for your champion...</p></div>
        </section>

        <!-- Settings of the overlay itself. -->
        <section class="ov-panel ov-settings" id="ovSettingsPanel" hidden>
            <label class="ov-row">
                <span>Opacity</span>
                <span class="ov-row-control">
                    <input type="range" class="ov-range" id="ovOpacitySlider" min="30" max="100" step="5" value="100">
                    <span class="ov-row-val" id="ovOpacityVal">100%</span>
                </span>
            </label>
            <div class="ov-row ov-row-stack">
                <span>Show or hide <span class="ov-hint">(hold Tab to see the players)</span></span>
                <div class="ov-seg" id="ovHotkeySeg" role="group" aria-label="Show or hide key">
                    <button type="button" data-value="Ctrl+Shift+H">Ctrl+Shift+H</button>
                    <button type="button" data-value="Ctrl+Shift+X">Ctrl+Shift+X</button>
                    <button type="button" data-value="F9">F9</button>
                    <button type="button" data-value="F10">F10</button>
                </div>
            </div>
            <label class="ov-row">
                <span>Lock position</span>
                <span class="ov-switch"><input type="checkbox" id="ovLockToggle"><span class="ov-switch-track"></span></span>
            </label>
            <div class="ov-row">
                <span>CS per minute goal</span>
                <div class="ov-seg" id="ovCsGoalSeg" role="group" aria-label="CS per minute goal">
                    <button type="button" data-value="6">6</button>
                    <button type="button" data-value="7">7</button>
                    <button type="button" data-value="8">8</button>
                    <button type="button" data-value="9">9</button>
                    <button type="button" data-value="10">10</button>
                </div>
            </div>
            <label class="ov-row">
                <span>Players button</span>
                <span class="ov-switch"><input type="checkbox" id="ovShowRankedToggle" checked><span class="ov-switch-track"></span></span>
            </label>
            <label class="ov-row">
                <span>Build button</span>
                <span class="ov-switch"><input type="checkbox" id="ovShowBuildsToggle" checked><span class="ov-switch-track"></span></span>
            </label>
        </section>

        <div class="ov-tip" id="ovTip" hidden></div>
    </div>
    <script src="js/overlay-stats.js"></script>
    <script src="js/overlay.js"></script>
</body>
</html>
