name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Dependency check
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify main entry exists
        shell: pwsh
        run: |
          $main = (Get-Content package.json | ConvertFrom-Json).main
          if (-not (Test-Path $main)) {
            Write-Error "Main entry '$main' not found"
            exit 1
          }
          Write-Host "Main entry '$main' found"
