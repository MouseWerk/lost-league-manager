name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so --generate-notes covers all commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace "^v", ""
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run build -- --publish never
        # --publish never prevents ow-electron-builder from trying to upload when it detects a tag

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ github.ref_name }}"
          $TITLE   = "Lost League Manager $VERSION"

          # Installer
          $EXE = Get-ChildItem dist\*Setup*.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $EXE) {
            $EXE = Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $EXE) { Write-Error "No installer found in dist/"; exit 1 }

          # latest.yml  — electron-updater reads this to detect new versions
          $YAML = "dist\latest.yml"
          if (-not (Test-Path $YAML)) { Write-Error "latest.yml not found in dist/"; exit 1 }

          # blockmap — enables delta (partial) downloads for the updater
          $BLOCKMAP = Get-ChildItem dist\*.blockmap -ErrorAction SilentlyContinue |
                        Select-Object -First 1 -ExpandProperty FullName

          Write-Host "Releasing: $EXE"
          Write-Host "Metadata:  $YAML"

          $assets = @($EXE, $YAML)
          if ($BLOCKMAP) { $assets += $BLOCKMAP }

          gh release create $VERSION `
            --title $TITLE `
            --generate-notes `
            @assets

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ github.ref_name }}
          path: dist/*.exe
          retention-days: 30
