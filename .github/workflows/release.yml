name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so generate-notes covers all commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace "^v", ""
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
        # electron-builder creates the release and uploads exe + latest.yml + blockmap
        # latest.yml must be published by electron-builder — it encodes the SHA512/size
        # in a format electron-updater understands; uploading it manually causes 404s

      - name: Set release title and changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ github.ref_name }}"
          $TITLE   = "Lost League Manager $VERSION"

          # GitHub API: generate changelog from commits since previous tag
          $BODY = gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f tag_name=$VERSION `
            --jq '.body'

          gh release edit $VERSION --title $TITLE --notes $BODY --draft=false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ github.ref_name }}
          path: dist/*.exe
          retention-days: 30
